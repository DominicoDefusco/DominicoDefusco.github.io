<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LeBron Test Page</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #423d4a;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            padding: 25px;
            background-color: #292631;
            text-align: center;
            border-bottom: 2px solid #5991ad;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        main {
            max-width: 800px;
            margin: 80px auto;
            padding: 30px;
            text-align: center;
        }

        h2 {
            font-size: 32px;
            margin-bottom: 15px;
        }

        p {
            color: #d0cbd6;
            line-height: 1.6;
        }

        button {
            margin-top: 25px;
            padding: 14px 28px;
            background-color: #5991ad;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #40738e;
        }

        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            padding: 15px;
            text-align: center;
            background-color: #292631;
            color: #aaa;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <header>
        <h1>LeBron Test Page</h1>
    </header>

    <main>
        <h2>Welcome!</h2>

        <p>
            This is a test webpage hosted on GitHub Pages.
            It is separate from the main website.
        </p>

        <button onclick="showPopup()">
            Test Popup
        </button>
    </main>

    <footer>
        dominicodefusco.com/lebron
    </footer>

    <script>
        // Popup when webpage loads
        window.onload = function() {
            alert("Test popup working!");
        };

        // Popup when button is clicked
        function showPopup() {
            alert("Button is working!");
        }
    </script>

</body>
</html>
